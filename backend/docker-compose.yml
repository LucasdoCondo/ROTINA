# PostgreSQL para desarrollo local de ROTINA Backend
# Uso: docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: rotina-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rotina
      POSTGRES_PASSWORD: rotina
      POSTGRES_DB: rotina_dev
    ports:
      - "5432:5432"
    volumes:
      - rotina_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rotina -d rotina_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rotina_pgdata: