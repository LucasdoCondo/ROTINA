# =============================================================
#  ROTINA — Ambiente de PRODUÇÃO (Docker Compose)
#
#  Serviços:
#    postgres   — PostgreSQL 16 (apenas rede interna)
#    redis      — Redis 7 (apenas rede interna)
#    backend    — Node.js + Express (apenas rede interna)
#    nginx      — ÚNICO ponto de entrada: serve o frontend e
#                 roteia /api/* para o backend (porta APP_PORT)
#
#  Uso (a partir da raiz):
#    docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
#    docker compose --env-file .env.production -f docker-compose.prod.yml ps
#    docker compose --env-file .env.production -f docker-compose.prod.yml logs -f backend
#    docker compose --env-file .env.production -f docker-compose.prod.yml down
#
#  Segurança:
#    - Postgres, Redis e Backend NÃO expõem portas ao host.
#    - Todo tráfego entra pelo Nginx (porta 80/APP_PORT).
# =============================================================

name: rotina-prod

services:
  postgres:
    image: postgres:16-alpine
    container_name: rotina-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rotina}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-rotina}
    volumes:
      - rotina_pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rotina} -d ${POSTGRES_DB:-rotina}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: rotina-redis-prod
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - rotina_redisdata_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: rotina-backend-prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      # Dentro da rede Docker o host é o nome do serviço
      DATABASE_URL: postgresql://${POSTGRES_USER:-rotina}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-rotina}?schema=public
      REDIS_URL: redis://redis:6379
    # Sem ports: acessível apenas pela rede interna (via Nginx)
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/v1/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    command: >
      sh -c "npx prisma migrate deploy &&
             node dist/server.js"

  nginx:
    build:
      context: .
      dockerfile: frontend/Dockerfile.prod
      args:
        # Caminho relativo: o navegador chama a mesma origem
        # e o Nginx roteia /api/* para o backend
        VITE_API_URL: /api/v1
    container_name: rotina-nginx-prod
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${APP_PORT:-80}:80"

volumes:
  rotina_pgdata_prod:
  rotina_redisdata_prod:
