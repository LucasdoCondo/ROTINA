# =============================================================
#  ROTINA — Stack de PRODUÇÃO (OCI / Oracle Cloud Infrastructure)
#
#  Arquitetura vigente:
#    Vercel — SPA React (build estático `frontend/dist`), CDN, SSL e
#             roteamento nativo (Serverless Functions quando aplicável)
#    Neon   — PostgreSQL gerenciado (DATABASE_URL em .env.production)
#    OCI    — backend Express (este compose) + Redis
#
#  Limpeza aplicada (remoção do Nginx e do deploy legado):
#    - Serviço `nginx` REMOVIDO  → roteamento/SSL agora são da Vercel.
#    - Serviço `frontend` REMOVIDO → o bundle vai para a Vercel (frontend/dist).
#    - Serviço `postgres` REMOVIDO do fluxo padrão → o banco de produção é o
#      Neon (bloco comentado no fim do arquivo como fallback self-hosted).
#    - O backend PUBLICA a porta no host (antes só o Nginx o alcançava).
#
#  Uso (a partir da raiz):
#    docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
#    docker compose --env-file .env.production -f docker-compose.prod.yml ps
#    docker compose --env-file .env.production -f docker-compose.prod.yml logs -f backend
#    docker compose --env-file .env.production -f docker-compose.prod.yml down
#
#  Verificação local da stack:
#    powershell -ExecutionPolicy Bypass -File scripts\verificar-stack-local.ps1
#
#  TLS na borda: exponha a API sempre atrás de HTTPS (OCI Load Balancer,
#  Caddy/Traefik na VM ou Cloudflare). Ajuste TRUST_PROXY em .env.production
#  para o número real de proxies (0 = exposto direto, 1 = um proxy/LB).
# =============================================================

name: rotina-prod

services:
  redis:
    image: redis:7-alpine
    container_name: rotina-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - rotina_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    image: rotina-backend:prod
    container_name: rotina-backend
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    # Todas as variáveis (DATABASE_URL do Neon, JWT, CORS, rate limit...)
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
    # Único ponto de entrada da API (não há mais Nginx na frente)
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/v1/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    command: >
      sh -c "npx prisma migrate deploy &&
             node dist/server.js"

  # ── Processos de BACKGROUND (não existem na Vercel) ──────────
  # Workers BullMQ (e-mail/notificação) + purga diária de dados expirados.
  # A Vercel congela a Function após cada request/response, então isso roda
  # aqui (OCI) como processo long-lived. Mesma imagem do backend.
  #
  # Alternativa (parcial) na Vercel: `crons` no vercel.json chamando
  # GET /api/v1/internal/jobs/purge — coberto por CRON_SECRET.
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    image: rotina-backend:prod
    container_name: rotina-worker
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
    command: ["node", "dist/worker.js"]

volumes:
  rotina_redisdata:

