# =============================================================
#  ROTINA — Nginx (produção)
#
#  Papel:
#    - Serve o frontend React (build estático do Vite) em /
#    - Roteia a API:  /api/*  →  backend:3000 (Express)
#    - Fallback SPA para react-router (history API)
#
#  Montado em /etc/nginx/conf.d/default.conf pelo
#  frontend/Dockerfile.prod (via docker-compose.prod.yml)
# =============================================================

# Resolução por nome do serviço no compose (DNS interno do Docker)
upstream rotina_backend {
    server backend:3000;
}

server {
    listen 80;
    server_name _;

    # Uploads (ajuste conforme necessário)
    client_max_body_size 10m;

    # ── Compressão ───────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml
               image/svg+xml;

    # ── Segurança (headers básicos) ──────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Frontend — build estático do Vite
    root /usr/share/nginx/html;
    index index.html;

    # ── API → backend (Express) ─────────────────────────────
    # Sem barra final em proxy_pass: preserva o prefixo /api/
    location /api/ {
        proxy_pass http://rotina_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout    60s;
        proxy_connect_timeout 5s;
    }

    # ── Assets com hash no nome (cache imutável) ─────────────
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── SPA — fallback para react-router ─────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html nunca em cache (garante deploy de novas versões)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
