name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Monorepo com npm workspaces (backend + frontend). As dependências são
# instaladas UMA vez na raiz — mesmo caminho do build da Vercel, que roda
# `npm install` na raiz do repositório. O lockfile canônico é
# `package-lock.json` (raiz); os lockfiles por workspace são usados apenas
# pelos builds de Docker (contexto ./backend ou ./frontend).
jobs:
  backend:
    name: Backend (typecheck + test + build)
    runs-on: ubuntu-latest
    env:
      # O schema Prisma referencia DATABASE_URL **e** DIRECT_URL (Neon):
      # sem as duas, `prisma generate`/`validate` falham com P1012.
      DATABASE_URL: postgresql://rotina:rotina@localhost:5432/rotina_test?schema=public
      DIRECT_URL: postgresql://rotina:rotina@localhost:5432/rotina_test?schema=public
      JWT_ACCESS_SECRET: ci-only-secret-for-tests-with-at-least-32-chars
      NODE_ENV: test
      TZ: UTC
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rotina
          POSTGRES_PASSWORD: rotina
          POSTGRES_DB: rotina_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rotina -d rotina_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      # Instala os workspaces e roda o `postinstall` do backend
      # (`prisma generate`) — é o mesmo install que a Vercel executa.
      - name: Install (workspaces)
        run: npm ci

      - name: Prisma validate
        working-directory: backend
        run: npx prisma validate

      - name: Run migrations
        working-directory: backend
        run: npx prisma migrate deploy

      - name: Typecheck
        working-directory: backend
        run: npm run typecheck

      - name: Test
        working-directory: backend
        run: npm test

      - name: Build
        working-directory: backend
        run: npm run build

      # Valida o adaptador Serverless (api/index.ts) como a Vercel o invoca,
      # sem depender de PostgreSQL.
      - name: Smoke do adaptador serverless
        working-directory: backend
        run: npm run smoke:serverless

  frontend:
    name: Frontend (typecheck + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install (workspaces)
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Build (production)
        working-directory: frontend
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7